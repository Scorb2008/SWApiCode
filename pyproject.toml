[project]
name = "swapicode"
version = "0.1.0"
description = "Bot service for selling Codex API accounts"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "openpyxl>=3.1",
    "pydantic-settings>=2.6",
]

[project.scripts]
bot = "src.bot.__main__:main"
api = "src.main:run_api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.uv]
package = true
